name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk-builder/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK with Cordova
        run: |
          set -e
          npm i -g cordova@12
          cd /tmp
          cordova create luopanapp com.mingli.luopan Luopan
          cd luopanapp
          # 覆盖为最新罗盘资源
          cp -r "$GITHUB_WORKSPACE/apk-builder/www/." www/
          cp "$GITHUB_WORKSPACE/apk-builder/config.xml" ./
          mkdir -p res
          cp "$GITHUB_WORKSPACE/apk-builder/res/icon.png" res/
          # 构建（debug 签名，可直接安装）
          cordova platform add android@13
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luopan-apk
          path: /tmp/luopanapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
