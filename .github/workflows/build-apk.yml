name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk-builder/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        run: |
          set -e
          npm i -g cordova@12
          cd /tmp
          cordova create luopanapp com.mingli.luopan Luopan
          cd luopanapp
          cp -r "$GITHUB_WORKSPACE/apk-builder/www/." www/
          cp "$GITHUB_WORKSPACE/apk-builder/config.xml" ./
          mkdir -p res
          cp "$GITHUB_WORKSPACE/apk-builder/res/icon.png" res/
          # 生成正式签名密钥
          keytool -genkeypair -v -keystore luopan.keystore -alias luopan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mingli2026 -keypass mingli2026 \
            -dname "CN=Luopan, OU=mingli, O=mingli, L=Beijing, ST=Beijing, C=CN"
          # build.json 配置 release 签名
          cat > build.json <<'EOF'
{
  "android": {
    "release": {
      "keystore": "luopan.keystore",
      "storePassword": "mingli2026",
      "alias": "luopan",
      "password": "mingli2026",
      "keystoreType": ""
    }
  }
}
EOF
          cordova platform add android@13
          cordova build android --release
          # 复制产物
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/output/时空罗盘.apk"
          cp luopan.keystore "$GITHUB_WORKSPACE/output/luopan.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luopan-apk
          path: |
            output/时空罗盘.apk
            output/luopan.keystore
          if-no-files-found: error
